name: kinti
description: Kinti — plataforma financiera digital personalizada (prueba técnica Mobile Flutter Senior).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Estado y arquitectura
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  get_it: ^8.0.3
  go_router: ^14.6.2
  # Red, caché y seguridad
  dio: ^5.7.0
  connectivity_plus: ^6.1.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  # Ecosistema
  webview_flutter: ^4.10.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
