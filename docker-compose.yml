services:
  bff:
    build: ./bff
    ports: ["8080:8080"]
    environment:
      NODE_ENV: development
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://10.0.2.2:8080}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-not-for-prod}
      ADMIN_KEY: ${ADMIN_KEY:-dev-admin-key}
      EXPOSE_OTP: "true"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
    volumes: ["kinti-data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 10s
volumes:
  kinti-data:
